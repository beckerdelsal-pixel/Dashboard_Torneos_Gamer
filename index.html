<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos Gamer</title>

    <link rel="stylesheet" href="estilos.css" />

</head>

<body>
    <div style="margin-bottom: 1rem;">
    <label for="txtBuscar">Buscar Torneo:</label>
    <input type="text" id="txtBuscar" onkeyup="buscarTorneos();" placeholder="Escribe Nombre/Categoría para buscar..." />
    <input type="button" value="Buscar" onclick="mostrarTorneos();" />
</div>

    <h1>Dashboard Torneos Gamer</h1>
    <form id="formularioTorneos">
        <div>
            <label for="nombre">Nombre del Torneo: </label>
            <input type="text" id="txtNombre" />

        </div>
        <div>
            <label for="categoria">Categoria del Torneo: </label>
            <select id="categoria">
                <option value="Lucha">Lucha</option>
                <option value="Estrategia">Estrategia</option>
                <option value="Arcade">Arcade</option>
                <option value="Deportes">Deportes</option>
                <option value="Aventuras">Aventuras</option>
            </select>

        </div>
        <div>
            <label for="participantes">Participantes del Torneo: </label>
            <input type="number" id="numParticipantes" min="1" max="100" />

        </div>
        <div>
            <label for="valor">Valor de Inscripcion: </label>
            <input type="number" id="numValor" />

        </div>
        <div>
            <label for="email">Email del Organizador: </label>
            <input type="email" id="txtEmail" />

        </div>

        <input type="button" value="REGISTRAR TORNEO" onclick="registrarTorneo();" id="btnRegistrar"/>
    </form>
    <p id="mensajeError"></p>
    <p id="mensajeExito"></p>
    <div>
        <h3>Torneos Registrados</h3>
        <table class="tablas">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Categoria</th>
                    <th>Particiantes</th>
                    <th>Valor de Inscripcion</th>
                    <th>Email</th>
                    <th>Recaudacion Estimada</th>
                    <th>Acciones</th>
                </tr>

            </thead>
            <tbody id="cuerpoTabla">


            </tbody>
        </table>
    </div>
    <div id="contenedor">

    </div>
    <script src="dashboard.js"></script>
</body>

</html>
